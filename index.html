<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وكالة سبيشل👑 | SPECIAL AGENCY</title>
<meta name="description" content="وكالة سبيشل👑 | SPECIAL AGENCY — هوية مؤسسية فاخرة واحترافية.">
<style>
:root{
  --royal-purple:#2a1b4d;
  --royal-purple-deep:#160f2b;
  --royal-purple-soft:#3b2a68;
  --metallic-gold:#d4af37;
  --metallic-gold-soft:#e6c65c;
  --black:#0b0912;
  --white:#ffffff;
  --muted:#c9c4dd;
  --whatsapp:#25d366;

  --space-1:8px;
  --space-2:16px;
  --space-3:24px;
  --space-4:32px;
  --space-5:48px;

  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;

  --font:Arial,"Segoe UI",sans-serif;
  --transition:.2s ease;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:var(--space-3);
  background:
    radial-gradient(circle at 20% 10%, rgba(212,175,55,.08), transparent 35%),
    linear-gradient(160deg,var(--black),var(--royal-purple-deep) 55%,var(--royal-purple));
  color:var(--white);
  font-family:var(--font);
}

.card{
  width:100%;
  max-width:430px;
  text-align:center;
  padding:var(--space-5) var(--space-3);
  background:rgba(22,15,43,.82);
  border:1px solid rgba(212,175,55,.35);
  border-radius:var(--radius-lg);
  box-shadow:0 24px 60px rgba(0,0,0,.45);
}

.brand{
  font-size:15px;
  letter-spacing:3px;
  color:var(--metallic-gold);
  margin-bottom:var(--space-2);
}

h1{
  font-size:28px;
  line-height:1.5;
  margin-bottom:var(--space-2);
  color:var(--white);
}

.divider{
  width:70px;
  height:2px;
  margin:0 auto var(--space-4);
  background:linear-gradient(90deg,transparent,var(--metallic-gold),transparent);
}

.actions{
  display:flex;
  flex-direction:column;
  gap:var(--space-2);
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:15px var(--space-3);
  border-radius:var(--radius-sm);
  font-size:17px;
  font-weight:bold;
  text-decoration:none;
  transition:var(--transition);
}

.join{
  background:linear-gradient(135deg,var(--metallic-gold),var(--metallic-gold-soft));
  color:var(--black);
  border:1px solid rgba(255,255,255,.18);
}

.join:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(212,175,55,.28);
}

.contact{
  background:transparent;
  color:var(--white);
  border:1px solid rgba(212,175,55,.55);
}

.contact:hover{
  background:rgba(212,175,55,.12);
  border-color:var(--metallic-gold);
}

.contact svg{
  width:20px;
  height:20px;
  fill:var(--whatsapp);
}

footer{
  margin-top:var(--space-5);
  font-size:13px;
  line-height:1.9;
  color:var(--muted);
  text-align:center;
}

@media (max-width:380px){
  h1{font-size:24px}
  .btn{font-size:16px}
}
</style>
</head>
<body>

<main class="card">

  <div class="brand">SPECIAL AGENCY</div>

  <h1>وكالة سبيشل👑</h1>

  <div class="divider"></div>

  <div class="actions">

    <a class="btn join" href="https://dnf4twa.s.gy/انضم-إلينا" target="_blank" rel="noopener">
      انضم الآن
    </a>

    <a class="btn contact" href="https://wa.me/SpecialAgency.Official" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.7-.1a11 11 0 0 1-4-2.4 11 11 0 0 1-2.3-3.4c-.3-.8-.3-1.5-.2-2 .1-.5.7-1.4 1.2-1.6.3-.1.7-.1.9.2l.9 1.6c.1.3.1.5 0 .7l-.5.7c-.2.2-.2.4-.1.6.4.8 1.6 2.1 2.6 2.6.2.1.4.1.6-.1l.6-.7c.2-.2.4-.2.7-.1l1.6.8c.3.2.4.5.4.9z"/>
      </svg>
      تواصل مع الإدارة
    </a>

  </div>

  <footer>
    © وكالة سبيشل👑 | SPECIAL AGENCY<br>
    جميع الحقوق محفوظة<br>
    2026
  </footer>

</main>

</body>
</html>
