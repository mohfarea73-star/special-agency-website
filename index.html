<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b1b">
  <meta name="description" content="وكالة سبيشل👑 | SPECIAL AGENCY — ابدأ الانضمام الآن عبر BIGO LIVE أو تواصل مع الإدارة.">
  <meta name="color-scheme" content="dark">
  <title>وكالة سبيشل👑 | SPECIAL AGENCY</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100b1b;
      --surface: #1b1129;
      --surface-soft: #241632;
      --purple: #7040a0;
      --gold: #d8b66d;
      --gold-light: #f0d99f;
      --text: #fffaf0;
      --muted: #c9bfd2;
      --whatsapp: #25d366;
      --line: rgba(216, 182, 109, .28);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(112, 64, 160, .22), transparent 54%),
        var(--bg);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { -webkit-tap-highlight-color: transparent; }
    .site-header {
      width: 100%;
      padding: 25px 20px 21px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    .brand-name {
      display: inline-block;
      color: var(--gold-light);
      font-size: clamp(19px, 4.8vw, 25px);
      font-weight: 800;
      letter-spacing: .1px;
    }
    .brand-rule {
      width: 54px;
      height: 2px;
      margin: 12px auto 0;
      border-radius: 2px;
      background: var(--gold);
      opacity: .85;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 42px 20px 48px;
      text-align: center;
    }
    .hero-panel {
      position: relative;
      overflow: hidden;
      padding: clamp(30px, 7vw, 52px) clamp(18px, 5vw, 38px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(73, 39, 103, .78), rgba(31, 18, 46, .96) 58%, rgba(20, 13, 30, .98));
      box-shadow: 0 18px 55px rgba(0, 0, 0, .24);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .7px;
    }
    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(27px, 7vw, 43px);
      line-height: 1.5;
      font-weight: 800;
    }
    h1 span { color: var(--gold-light); }
    .intro {
      max-width: 480px;
      margin: 15px auto 0;
      color: var(--muted);
      font-size: clamp(14px, 3.8vw, 16px);
    }
    .actions {
      display: grid;
      gap: 13px;
      width: 100%;
      max-width: 390px;
      margin: 31px auto 0;
    }
    .btn {
      min-height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 13px 18px;
      border: 1px solid transparent;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
      text-decoration: none;
      transition: background-color .16s ease, border-color .16s ease, transform .16s ease;
    }
    .btn-primary {
      color: #21152b;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      box-shadow: 0 7px 22px rgba(216, 182, 109, .13);
    }
    .btn-primary:hover { background: #f5dfa9; }
    .btn-secondary {
      color: var(--text);
      border-color: rgba(37, 211, 102, .62);
      background: rgba(37, 211, 102, .07);
    }
    .btn-secondary:hover { background: rgba(37, 211, 102, .13); }
    .btn svg { width: 23px; height: 23px; flex: 0 0 23px; }
    .btn-secondary svg { color: var(--whatsapp); }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    .site-footer {
      padding: 19px 16px 22px;
      border-top: 1px solid rgba(255, 255, 255, .09);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .copyright-name { color: var(--gold-light); font-weight: 700; }
    .rights { display: block; margin-top: 3px; }

    @media (max-width: 420px) {
      .site-header { padding-top: 20px; padding-bottom: 18px; }
      main { padding: 28px 15px 34px; }
      .hero-panel { border-radius: 17px; }
      .btn { min-height: 56px; padding-inline: 12px; font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand-name">وكالة سبيشل👑 | SPECIAL AGENCY</div>
    <div class="brand-rule" aria-hidden="true"></div>
  </header>

  <main>
    <section class="hero-panel" aria-labelledby="main-heading">
      <p class="eyebrow">نكتشف المواهب… نطوّر القدرات… ونصنع النجوم</p>
      <h1 id="main-heading">ابدأ رحلتك مع <span>سبيشل👑</span></h1>
      <p class="intro">خطوتك الأولى نحو صناعة حضورك والانطلاق عبر BIGO LIVE تبدأ من هنا.</p>

      <div class="actions">
        <a class="btn btn-primary"
           href="https://dnf4twa.s.gy/انضم-إلينا"
           aria-label="ابدأ الانضمام الآن عبر BIGO LIVE">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="4" stroke="currentColor" stroke-width="2"/>
            <path d="M10 9v6l5-3-5-3Z" fill="currentColor"/>
          </svg>
          <span>ابدأ الانضمام الآن عبر BIGO LIVE</span>
        </a>

        <a class="btn btn-secondary"
           href="https://wa.me/SpecialAgency.Official"
           aria-label="تواصل مع الإدارة عبر واتساب">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M20.52 3.48A11.82 11.82 0 0 0 12.1 0C5.55 0 .22 5.32.22 11.87c0 2.09.55 4.13 1.59 5.93L.12 24l6.35-1.66a11.9 11.9 0 0 0 5.63 1.43h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.24-6.15-3.47-8.41ZM12.11 21.75a9.86 9.86 0 0 1-5.02-1.37l-.36-.21-3.77.99 1.01-3.67-.23-.38a9.84 9.84 0 1 1 8.37 4.64Zm5.4-7.37c-.3-.15-1.77-.87-2.05-.97-.28-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.5 1.69.64.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/>
          </svg>
          <span>تواصل مع الإدارة</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span class="copyright-name">© <span id="copyright-year">2026</span> وكالة سبيشل👑 | SPECIAL AGENCY</span>
    <span class="rights">جميع الحقوق محفوظة.</span>
  </footer>

  <script>
    document.getElementById('copyright-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
